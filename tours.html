<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Tours - TripWise</title>
    <meta name="description"
        content="Browse and search all available tours on TripWise. Filter by location, price, duration, and rating.">
    <meta name="author" content="Naitik Agrawal">
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Comforter+Brush&family=Heebo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body id="top">

    <a href="#main-content" class="skip-nav">Skip to main content</a>

    <!-- HEADER -->
    <header class="header" data-header>
        <div class="container">
            <a href="/index.html">
                <h1 class="logo">TripWise</h1>
            </a>
            <button class="nav-toggle-btn" data-nav-toggle-btn aria-label="Toggle navigation menu"
                aria-expanded="false">
                <ion-icon name="menu-outline" class="open" aria-hidden="true"></ion-icon>
                <ion-icon name="close-outline" class="close" aria-hidden="true"></ion-icon>
            </button>
            <nav class="navbar" id="main-nav" role="navigation" aria-label="Main navigation">
                <ul class="navbar-list">
                    <li><a href="/index.html" class="navbar-link">Home</a></li>
                    <li><a href="/tours.html" class="navbar-link">Tours</a></li>
                    <li><a href="/blog.html" class="navbar-link">Blog</a></li>
                    <li><a href="/contact.html" class="navbar-link">Contact Us</a></li>
                </ul>
                <a href="/auth.html" class="btn btn-secondary">Login / Register</a>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <!-- Page Hero -->
        <section class="page-hero">
            <div class="container">
                <p class="section-subtitle">Explore</p>
                <h2 class="h2 section-title">All Tours</h2>
                <p class="page-hero-text">Discover our handpicked tours around the world</p>
            </div>
        </section>

        <!-- Search & Filters -->
        <section class="section filters-section">
            <div class="container">
                <div class="filters-bar">

                    <div class="filter-group search-group">
                        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
                        <input type="text" id="search-input" placeholder="Search tours..." aria-label="Search tours">
                    </div>

                    <div class="filter-group">
                        <select id="filter-sort" aria-label="Sort tours">
                            <option value="">Sort By</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                            <option value="duration">Shortest First</option>
                            <option value="newest">Newest</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <select id="filter-difficulty" aria-label="Filter by difficulty">
                            <option value="">All Levels</option>
                            <option value="Easy">Easy</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Challenging">Challenging</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <select id="filter-price" aria-label="Filter by price range">
                            <option value="">Any Price</option>
                            <option value="50">Under $50</option>
                            <option value="100">Under $100</option>
                            <option value="200">Under $200</option>
                        </select>
                    </div>

                    <button class="btn btn-outline btn-sm" id="clear-filters">Clear All</button>
                </div>
            </div>
        </section>

        <!-- Tours Grid -->
        <section class="section tours-grid-section">
            <div class="container">

                <div class="results-info">
                    <p id="results-count">Loading tours...</p>
                </div>

                <ul class="tours-grid" id="tours-grid">
                    <!-- Tours loaded dynamically -->
                </ul>

                <div class="pagination" id="pagination"></div>

                <!-- Empty State -->
                <div class="empty-state hidden" id="empty-state">
                    <ion-icon name="compass-outline" aria-hidden="true"></ion-icon>
                    <h3>No tours found</h3>
                    <p>Try adjusting your search or filters</p>
                </div>

            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer" style="background-image: url('./assets/images/footer-bg.png')">
        <div class="container">
            <div class="footer-bottom">
                <a href="/index.html" class="logo">TripWise</a>
                <p class="copyright">&copy; 2026 <a href="#" class="copyright-link">Naitik Agrawal</a>. All Rights
                    Reserved</p>
                <ul class="social-list">
                    <li><a href="#" class="social-link" aria-label="Facebook"><ion-icon name="logo-facebook"
                                aria-hidden="true"></ion-icon></a></li>
                    <li><a href="#" class="social-link" aria-label="Twitter"><ion-icon name="logo-twitter"
                                aria-hidden="true"></ion-icon></a></li>
                    <li><a href="#" class="social-link" aria-label="Instagram"><ion-icon name="logo-instagram"
                                aria-hidden="true"></ion-icon></a></li>
                    <li><a href="https://www.linkedin.com/in/naitik-agrawal-9b832128a" class="social-link"
                            aria-label="LinkedIn"><ion-icon name="logo-linkedin" aria-hidden="true"></ion-icon></a></li>
                </ul>
            </div>
        </div>
    </footer>

    <a href="#top" class="go-top" data-go-top aria-label="Go To Top"><ion-icon name="chevron-up-outline"></ion-icon></a>

    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/script.js"></script>
    <script>
        let currentPage = 1;

        async function loadTours() {
            const search = document.getElementById('search-input').value.trim();
            const sort = document.getElementById('filter-sort').value;
            const difficulty = document.getElementById('filter-difficulty').value;
            const maxPrice = document.getElementById('filter-price').value;

            const params = { page: currentPage, limit: 9 };
            if (search) params.search = search;
            if (sort) params.sort = sort;
            if (difficulty) params.difficulty = difficulty;
            if (maxPrice) params.maxPrice = maxPrice;

            try {
                const result = await TripWise.getTours(params);
                const grid = document.getElementById('tours-grid');
                const empty = document.getElementById('empty-state');
                const count = document.getElementById('results-count');

                if (result.data.length === 0) {
                    grid.innerHTML = '';
                    empty.classList.remove('hidden');
                    count.textContent = 'No tours found';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                empty.classList.add('hidden');
                count.textContent = `Showing ${result.data.length} of ${result.total} tours`;

                grid.innerHTML = result.data.map(tour => `
          <li>
            <a href="/tour.html?id=${tour.slug || tour.id}" class="popular-card tour-card-link">
              <figure class="card-banner">
                <img src="${tour.image}" width="740" height="518" loading="lazy" alt="${tour.title}" class="img-cover">
                <span class="card-badge">
                  <ion-icon name="time-outline" aria-hidden="true"></ion-icon>
                  <time>${tour.duration}</time>
                </span>
                ${tour.difficulty ? `<span class="card-difficulty ${tour.difficulty.toLowerCase()}">${tour.difficulty}</span>` : ''}
              </figure>
              <div class="card-content">
                <div class="card-wrapper">
                  <div class="card-price">From ${TripWise.formatPrice(tour.price)}</div>
                  <div class="card-rating">
                    ${TripWise.renderStars(tour.rating)}
                    <data value="${tour.reviewCount}">(${tour.reviewCount})</data>
                  </div>
                </div>
                <h3 class="card-title">${tour.title}</h3>
                <address class="card-location">
                  <ion-icon name="location-outline" aria-hidden="true"></ion-icon>
                  ${tour.location}, ${tour.country}
                </address>
              </div>
            </a>
          </li>
        `).join('');

                // Pagination
                renderPagination(result);
            } catch (err) {
                console.error('Failed to load tours:', err);
                document.getElementById('results-count').textContent = 'Failed to load tours. Please try again.';
            }
        }

        function renderPagination(result) {
            const pag = document.getElementById('pagination');
            if (result.totalPages <= 1) { pag.innerHTML = ''; return; }

            let html = '';
            for (let i = 1; i <= result.totalPages; i++) {
                html += `<button class="pag-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            pag.innerHTML = html;

            pag.querySelectorAll('.pag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    loadTours();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        // Filter events
        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { currentPage = 1; loadTours(); }, 400);
        });

        document.getElementById('filter-sort').addEventListener('change', () => { currentPage = 1; loadTours(); });
        document.getElementById('filter-difficulty').addEventListener('change', () => { currentPage = 1; loadTours(); });
        document.getElementById('filter-price').addEventListener('change', () => { currentPage = 1; loadTours(); });

        document.getElementById('clear-filters').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-sort').value = '';
            document.getElementById('filter-difficulty').value = '';
            document.getElementById('filter-price').value = '';
            currentPage = 1;
            loadTours();
        });

        loadTours();
    </script>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
